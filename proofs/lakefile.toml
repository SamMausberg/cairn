name = "cairn-proofs"
version = "1.0.0"
defaultTargets = ["Cairn"]

# No dependencies: everything below is proved against Lean 4 core only
# (Init/Std: `omega`, `decide`, `simp`, `Int`/`Nat`/`List` lemmas). Mathlib is
# deliberately not used so that the trusted base stays as small as possible and
# the build stays reproducible from the pinned `lean-toolchain` alone.

[[lean_lib]]
name = "Cairn"
