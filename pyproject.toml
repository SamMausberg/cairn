[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "cairn-language"
version = "0.6.0"
description = "A checked native CPU compiler prototype and agent editing toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
classifiers = ["Development Status :: 3 - Alpha", "Private :: Do Not Upload"]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]

[project.scripts]
cairn = "cairn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cairn = ["runtime/*.hpp", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
