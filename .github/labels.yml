# Every label this repository uses. Each prefix answers one question, so an issue takes at most one kind:, any
# number of area: and backend:, and a needs: only while it waits. tools/release/sync_labels.py applies this file with
# gh when the owner runs it; nothing else writes labels. CONTRIBUTING.md says who applies each prefix.

- name: "kind:bug"
  color: "d73a4a"
  description: "Something does what the documentation says it should not"
- name: "kind:soundness"
  color: "b60205"
  description: "An accepted program that is unsafe; reported privately first, as SECURITY.md says"
- name: "kind:performance"
  color: "f9a825"
  description: "Slower than it should be, or a prediction a measurement contradicts"
- name: "kind:language"
  color: "0e8a16"
  description: "A new form, rule or library function"
- name: "kind:tooling"
  color: "5319e7"
  description: "A command, its record, or the editor and agent tools"
- name: "kind:kernel"
  color: "0052cc"
  description: "A kernel or benchmark to write in CAIRN, with its reference"
- name: "kind:evaluation"
  color: "006b75"
  description: "A measurement: CAIRN's code on hardware, or how agents do in it"

- name: "area:compiler"
  color: "c5def5"
  description: "The parser, checker, recipes and lowering, and the packaged std"
- name: "area:runtime"
  color: "c5def5"
  description: "The C++ and CUDA headers under src/cairn/runtime"
- name: "area:projects"
  color: "c5def5"
  description: "Manifests, dependencies, targets, export and vendored foreign sources"
- name: "area:agent"
  color: "c5def5"
  description: "Edit sessions, packets, rule cards, the skill and cairn mcp"
- name: "area:editor"
  color: "c5def5"
  description: "The formatter, the grammars and the language server"
- name: "area:perf"
  color: "c5def5"
  description: "cairn predict, cairn tune, device cards and measurement"
- name: "area:verify"
  color: "c5def5"
  description: "Validation, SMT equivalence, cairn diff and the Lean proofs"
- name: "area:docs"
  color: "c5def5"
  description: "The reference, the guide and the rest of docs/"
- name: "area:ci"
  color: "c5def5"
  description: "The workflows under .github and the release tools under tools/release"
- name: "area:examples"
  color: "c5def5"
  description: "examples/, demos/ and the benchmarks under bench/"

- name: "backend:host"
  color: "d4c5f9"
  description: "Host code built by clang++ or g++ for x86-64 or AArch64"
- name: "backend:cuda"
  color: "d4c5f9"
  description: "Device code built by nvcc for an sm_NN target"
- name: "backend:freestanding"
  color: "d4c5f9"
  description: "The freestanding AArch64 profile: MMIO and bare-metal images"
- name: "backend:hip"
  color: "d4c5f9"
  description: "AMD GPU code through HIP, which does not exist yet"

- name: "needs:hardware"
  color: "fef2c0"
  description: "Settled only by a run on hardware CI lacks, such as a GPU"
- name: "needs:design"
  color: "fef2c0"
  description: "Waits on a decision about the language or a tool before code"

- name: "good first issue"
  color: "7057ff"
  description: "Small and self-contained, with the file that owns it named"
