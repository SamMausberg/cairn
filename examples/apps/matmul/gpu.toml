# The device configuration: the host project with src/main.cairn replaced by the device entry, because any @device
# view sends the whole program through nvcc and the host build must stay buildable where there is no GPU. It runs
# only under `make gpu`:
#
#   cairn run examples/apps/matmul/gpu.toml
[project]
name = "matmul-gpu"
sources = ["src/layer.cairn", "src/device_main.cairn"]

[build]
kind = "exe"
arch = "baseline"
