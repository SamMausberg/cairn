# The device configuration. It is the host project with src/main.cairn replaced by the device
# entry, because any @device view sends the whole program through nvcc and the host-only
# build must stay buildable where there is no GPU. A manifest is named by its path:
#
#   cairn run examples/apps/analytics/gpu.toml
[project]
name = "analytics-gpu"
sources = [
  "src/cols.cairn",
  "src/sensor.cairn",
  "src/schema.cairn",
  "src/agg.cairn",
  "src/query.cairn",
  "src/table.cairn",
  "src/report.cairn",
  "src/device.cairn",
  "src/device_main.cairn",
]

[build]
kind = "exe"
arch = "baseline"
