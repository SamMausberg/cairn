[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "cairn-language"
version = "1.2.0"
description = "A systems language with visible costs, second-class borrows, CPU/GPU lanes and compiler-admitted AI edits"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
classifiers = ["Development Status :: 3 - Alpha", "Private :: Do Not Upload"]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "pytest-xdist", "ruff", "mypy"]

[project.scripts]
cairn = "cairn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cairn = ["runtime/*.hpp", "std/*.cairn", "targets/*/*.S", "targets/*/*.ld", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests/language", "tests/soundness"]  # The agent-layer tests reuse those programs.

[tool.ruff]
extend-exclude = [".claude"]  # Agent worktrees are whole copies of the repository.
line-length = 120
target-version = "py311"
src = ["src", "tests", "tools", "bench"]

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PIE", "SIM", "RUF"]
isort.split-on-trailing-comma = false
ignore = [
    "E501",   # the formatter owns line length; long diagnostics stay on one line
    "SIM108", # ternaries are not always clearer in a checker
    "SIM905", # a paragraph of reserved words reads better than a wall of quoted strings
    "RUF001", # mathematical symbols in documentation strings are intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "E731", "E741", "B905", "B007", "B023"]  # independent oracles stay as written
"tools/**" = ["E402"]
"bench/**" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["src/cairn"]
check_untyped_defs = true
strict_optional = false  # Tree annotations (Expr.ty, Expr.ref) are filled by the checker, not at parse time.
warn_unused_ignores = true
warn_redundant_casts = true
